name: DailyHub AI CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
